name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The repo's .cargo/config.toml points target-dir at a local F: drive;
  # override it on CI runners.
  CARGO_TARGET_DIR: target

jobs:
  check:
    name: check · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Pinned to a commit (the branch name would otherwise be mutable); the
      # toolchain is then selected explicitly.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # WebRTC loopback / e2e tests open UDP sockets on 127.0.0.1; fine on hosted runners.
      - run: cargo test --workspace
