name: Publish release

on:
  push:
    branches: [master]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Read release version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match Cargo.toml" }
          "CLEANDESK_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test clipboard, viewer, host and protocol
        run: cargo test --locked -p cleandesk-proto -p cleandesk-client -p cleandesk-host -p cleandesk-gui --lib --tests
      - name: Fetch portable WiX
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath installer\wix314
      - name: Build installer and binaries
        shell: pwsh
        run: |
          .\installer\build-msi.ps1 -Version $env:CLEANDESK_VERSION
          Compress-Archive -Path target\release\cleandesk.exe, target\release\cleandesk-signal-server.exe, target\release\cleandesk-relay-server.exe -DestinationPath "target\msi\CleanDesk-$env:CLEANDESK_VERSION-x64-binaries.zip"
          $sums = Get-ChildItem target\msi -File | Where-Object { $_.Extension -in ".msi", ".zip" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          [IO.File]::WriteAllText((Join-Path $PWD "target\msi\SHA256SUMS"), ($sums -join "`n") + "`n")
      - name: Publish release with installer, binaries and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:CLEANDESK_VERSION"
          $notes = "docs/releases/$env:CLEANDESK_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag "target/msi/CleanDesk-$env:CLEANDESK_VERSION-x64.msi" "target/msi/CleanDesk-$env:CLEANDESK_VERSION-x64-binaries.zip" target/msi/SHA256SUMS --draft --title "CleanDesk $env:CLEANDESK_VERSION" --notes-file $notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
