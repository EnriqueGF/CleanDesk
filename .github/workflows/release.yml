name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  msi:
    name: Windows MSI
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch WiX 3.14 (portable)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath installer\wix314
      - name: Build MSI
        shell: pwsh
        run: .\installer\build-msi.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/msi/*.msi
            target/msi/*.zip
            target/msi/SHA256SUMS
