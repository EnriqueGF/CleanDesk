[package]
name = "rotodesk-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "egui/eframe desktop UI: main window + session viewer."

[dependencies]
rotodesk-proto.workspace = true
rotodesk-core.workspace = true
rotodesk-client.workspace = true
rotodesk-host.workspace = true
rotodesk-codec.workspace = true
rotodesk-platform.workspace = true
rotodesk-crypto.workspace = true
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
eframe = "0.32.3"
egui = "0.32.3"
sys-locale = "0.3.2"
image.workspace = true
rotodesk-discovery.workspace = true
rotodesk-transport.workspace = true
# System tray icon (Windows message loop is provided by eframe/winit).
tray-icon = { version = "0.25.1", default-features = false }
# To reach the native window from the tray thread (show/raise while hidden).
raw-window-handle = "0.6"
# Native file picker for "Send file…" in the viewer.
rfd = { version = "0.15.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }
