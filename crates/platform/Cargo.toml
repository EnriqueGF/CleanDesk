[package]
name = "rotodesk-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OS integration: run-at-login, Windows service install/status, launching the host in the console session, GUI presence lock."

[dependencies]
rotodesk-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
sha2.workspace = true
image = { workspace = true, features = ["bmp"] }
# Self-update: GitHub Releases over HTTPS (rustls).
ureq = { version = "2.12.1", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
] }
