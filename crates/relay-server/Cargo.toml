[package]
name = "rotodesk-relay-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RotoDesk Relay: standards-compliant TURN server used as the fallback media path when P2P fails."

[lib]
name = "rotodesk_relay_server"
path = "src/lib.rs"

[[bin]]
name = "rotodesk-relay-server"
path = "src/main.rs"

[dependencies]
rotodesk-proto.workspace = true
rotodesk-discovery.workspace = true
rotodesk-crypto.workspace = true
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# TURN engine (RFC 5766) from the webrtc-rs project. Pinned: the server API
# (ServerConfig/ConnConfig/AuthHandler) has changed shape between minors.
turn = "=0.17.2"
# Same version `turn` links against: provides the `Conn` trait implemented by
# `tokio::net::UdpSocket` and the `Net` abstraction the relay allocators need.
webrtc-util = { version = "=0.17.1", default-features = false, features = ["conn", "vnet"] }

[dev-dependencies]
tracing-subscriber.workspace = true
